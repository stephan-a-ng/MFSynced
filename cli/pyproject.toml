[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moonfive-text-cli"
version = "0.1.0"
description = "Command-line client for the Moon Five text (iMessage relay) service."
requires-python = ">=3.10"
authors = [{ name = "Moon Five" }]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "moonfive-mf-core",
]

[project.optional-dependencies]
# ruff pinned to the 0.15 minor: see deploy/cli/pyproject.toml.
dev = ["pytest>=8.0", "ruff==0.15.22"]

[project.scripts]
mftext = "mftext.cli:main"

# Also mount under the `mf` front door as `mf text …` (mirrors mf deploy / mf data / mf access).
[project.entry-points."mf.plugins"]
text = "mftext.plugin:register"

[tool.setuptools.packages.find]
where = ["."]
include = ["mftext*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
